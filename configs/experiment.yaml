# Central experiment settings (read by later scripts)
seed: 42
inference:
  ctx_size: 2048
  n_gpu_layers: 0        # CPU-only: edge realism + clean perf counters
  temperature: 0
  max_tokens: 128
  threads: auto          # auto = physical cores (approx cpu_count/2)
  port: 8089
models:
  sizes: ["qwen2.5-0.5b", "qwen2.5-1.5b"]
  quants: ["F16", "Q8_0", "Q6_K", "Q5_K_M", "Q4_K_M", "Q4_0", "Q3_K_M", "Q2_K"]
telemetry:
  perf_events: ["cycles", "instructions", "cache-references", "cache-misses",
                "branch-misses", "context-switches", "page-faults"]
  perf_interval_ms: 100
